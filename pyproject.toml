[project]
name = "evsys-sdk"
version = "0.1.0"
description = "Declarative, modular experiment framework for LLM training (SFT, RL, distillation) with pluggable algorithms, data stores, log stores, and backends."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # --- Core ---
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typing-extensions>=4.12",
    "requests>=2.32",
    # Harbor is THE rollout engine for RL/SDFT (Job/Trial runner + TinkerLLM
    # sampler). Not optional — the SDK has no built-in rollout loop of its own.
    "harbor>=0.13.2",
    # --- Tinker hosted training ---
    # Pinned: the importance_sampling loss inputs (target_tokens/logprobs/advantages,
    # no mask/weights) are validated against this exact server/SDK version.
    "tinker==0.22.3",
    "tinker-cookbook==0.4.2",
    "chz",
    # --- Local training (TRL + peft on your own GPU) ---
    "torch>=2.4",
    "transformers>=4.40",
    "trl>=0.20",
    "peft>=0.10",
    "datasets>=2.20",
    "accelerate>=0.30",
    # --- Logging & plotting ---
    "tensorboard>=2.16",
    "matplotlib>=3.8",
    # --- Frontier / API-model inference + benchmarks ---
    "anthropic>=0.40",
    "google-genai>=0.5",
    "openai>=1.40",
    # --- Prompt optimization ---
    # optimize_anything's engine-pluggable API (engine=gepa/autoresearch/...)
    # is newer than the PyPI 0.1.4 wheel; until it ships, install from git:
    #   uv pip install "gepa[full] @ git+https://github.com/gepa-ai/gepa"
    "gepa>=0.1.4",
]

[project.optional-dependencies]
# Everything needed to run the SDK ships in the base install above. Only the
# development toolchain stays optional.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]
# Opt-in trace ingestion from hosted observability platforms. Adapters
# lazy-import their client, so `import evsys_sdk` works without this extra.
traces = [
    "langsmith>=0.1",
]

[project.scripts]
evsys = "evsys_sdk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evsys_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >5s",
    "tinker: tests that hit the Tinker API (require TINKER_API_KEY)",
    "langsmith: tests that hit LangSmith (require LANGSMITH_API_KEY)",
    "supabase: tests that hit Supabase (require SUPABASE_URL+key)",
    "gpu: tests that require CUDA",
]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "RUF"]
ignore = ["E501", "RUF013"]
