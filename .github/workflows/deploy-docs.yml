name: Deploy docs to GitHub Pages

# Builds the Fumadocs site in website/ and publishes it to GitHub Pages at
# https://trajectory-ai.github.io/evsys-sdk/
on:
  push:
    # `dev` is the long-term trigger; the docs branch is included so the site
    # can be published for review before it merges (remove after merge to dev).
    branches: [dev, docs/fumadocs-site]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Permissions required by actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build
        env:
          # Serve assets under the project-pages sub-path
          PAGES_BASE_PATH: /evsys-sdk

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
