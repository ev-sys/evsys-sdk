name: Docs build

# Build the docs site on PRs that touch website/ so broken MDX fails the check
# before merge (the deploy workflow only runs on main).
on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'website/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
