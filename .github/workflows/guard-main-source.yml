name: Guard main source

# Enforce "main can only be merged from dev": fail any PR into main whose source
# branch isn't dev. Add this job as a required status check on main.
on:
  pull_request:
    branches: [main]

jobs:
  source-branch:
    name: main-from-dev
    runs-on: ubuntu-latest
    steps:
      - name: Require source branch == dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::PRs into main must come from 'dev' (got '${{ github.head_ref }}'). Merge your change into dev first."
            exit 1
          fi
          echo "OK — source branch is dev."
