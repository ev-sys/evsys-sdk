<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>evsys</title>
<style>
/* Palette: the validated reference instance. Both modes are selected, not
   flipped — the dark column is the same hues re-stepped for the dark surface.
   Only the three categorical slots that clear the all-pairs gate are used. */
:root {
  color-scheme: light;
  --surface-0: #f6f5f3;
  --surface-1: #fcfcfb;
  --surface-2: #f0efec;
  --border:    #e3e1dc;
  --border-strong: #cfccc4;
  --text-1: #0b0b0b;
  --text-2: #52514e;
  --text-3: #86847d;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --series-3: #1baf7a;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  --sans: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232322;
    --border: #2e2e2c; --border-strong: #45443f;
    --text-1: #ffffff; --text-2: #c3c2b7; --text-3: #8d8b81;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --surface-2: #232322;
  --border: #2e2e2c; --border-strong: #45443f;
  --text-1: #ffffff; --text-2: #c3c2b7; --text-3: #8d8b81;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-1);
  font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }

.shell { display: grid; grid-template-columns: 214px 1fr; min-height: 100vh; }
.navcol { border-right: 1px solid var(--border); background: var(--surface-1); }
nav { padding: 20px 12px; position: sticky; top: 0; max-height: 100vh;
  overflow-y: auto; display: flex; flex-direction: column; }
.brand { display: flex; align-items: baseline; gap: 8px; padding: 0 10px 6px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand span { font-size: 11px; color: var(--text-3); font-family: var(--mono);
  overflow: hidden; text-overflow: ellipsis; }
nav button { display: flex; align-items: center; justify-content: space-between; gap: 8px;
  width: 100%; padding: 7px 10px; margin-bottom: 2px; border: 0; border-radius: 7px;
  background: transparent; color: var(--text-2); font: inherit; text-align: left; cursor: pointer; }
nav button:hover { background: var(--surface-2); color: var(--text-1); }
nav button[aria-current="true"] { background: var(--surface-2); color: var(--text-1); font-weight: 550; }
nav .count { font: 11px/1 var(--mono); color: var(--text-3); background: var(--surface-0);
  border: 1px solid var(--border); border-radius: 20px; padding: 3px 7px; }
nav .group { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--text-3); padding: 18px 10px 6px; }
main { padding: 28px 32px 64px; max-width: 1160px; }

.page-head { display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 22px; }
h1 { font-size: 21px; letter-spacing: -0.02em; margin: 0 0 4px; font-weight: 600; }
.sub { color: var(--text-2); font-size: 13px; margin: 0; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }
.muted { color: var(--text-3); }

.card { background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
.grid { display: grid; gap: 14px; }
.g4 { grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); }

.tile { background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 15px 17px; }
.tile .label { font-size: 12px; color: var(--text-2); margin-bottom: 7px; }
.tile .value { font-size: 26px; font-weight: 600; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums; line-height: 1.1; }
.tile .foot { font-size: 12px; color: var(--text-3); margin-top: 5px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px;
  padding: 2px 9px; border-radius: 20px; border: 1px solid var(--border-strong);
  color: var(--text-2); white-space: nowrap; }
.pill.good { color: var(--good); border-color: color-mix(in srgb, var(--good) 40%, transparent); }
.pill.warn { color: var(--warning); border-color: color-mix(in srgb, var(--warning) 45%, transparent); }
.pill.crit { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 40%, transparent); }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 11px;
  text-transform: uppercase; letter-spacing: .05em; padding: 0 12px 8px 0; }
td { padding: 9px 12px 9px 0; border-top: 1px solid var(--border); vertical-align: top; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.num { font-variant-numeric: tabular-nums; font-family: var(--mono); font-size: 12px; }
code { font-family: var(--mono); font-size: 12px; }
.mono { font-family: var(--mono); font-size: 12px; }

.chart-head { display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; margin-bottom: 4px; flex-wrap: wrap; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block;
  margin-right: 5px; vertical-align: -1px; }
svg.plot { display: block; width: 100%; overflow: visible; }
svg.plot .grid-line { stroke: var(--border); stroke-width: 1; }
svg.plot .axis-text { fill: var(--text-3); font: 11px var(--mono); }
svg.plot .cross { stroke: var(--border-strong); stroke-width: 1; }
.tooltip { position: fixed; pointer-events: none; z-index: 40; opacity: 0;
  background: var(--surface-1); border: 1px solid var(--border-strong);
  border-radius: 8px; padding: 8px 10px; font-size: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.14); transition: opacity .08s; min-width: 130px; }
.tooltip .tt-step { color: var(--text-3); font-family: var(--mono); font-size: 11px; margin-bottom: 5px; }
.tooltip .tt-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
.tooltip .tt-row b { font-variant-numeric: tabular-nums; font-weight: 550; }

/* the loop, as a strip: each stage shows its count and whether it has fired */
.pipeline { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; }
.stage { flex: 1 1 130px; border: 1px solid var(--border); border-radius: 9px;
  padding: 12px 14px; background: var(--surface-0); }
.stage.on { border-color: var(--border-strong); background: var(--surface-1); }
.stage-v { font-size: 22px; font-weight: 600; letter-spacing: -.02em;
  font-variant-numeric: tabular-nums; color: var(--text-3); }
.stage.on .stage-v { color: var(--text-1); }
.stage-l { font-size: 12px; color: var(--text-2); margin-top: 3px; }
.stage-n { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.arrow { align-self: center; color: var(--text-3); font-size: 14px; }
.run-block { border-top: 1px solid var(--border); padding-top: 14px; margin-top: 14px; }
.run-block:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
.run-block h3 { font-size: 13px; margin: 0 0 10px; font-family: var(--mono); }
.agent-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 900px) { .agent-row { grid-template-columns: 1fr; } }
.agent { border: 1px solid var(--border); border-radius: 9px; padding: 13px 15px;
  background: var(--surface-0); }
.agent-h { display: flex; align-items: center; justify-content: space-between;
  gap: 10px; margin-bottom: 5px; }
.agent-p { font-size: 12px; color: var(--text-3); margin: 0 0 10px; }
.chain { font-size: 12px; color: var(--text-2); background: var(--surface-0);
  border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; }
.msgs { display: flex; flex-direction: column; gap: 8px; }
.msg { display: grid; grid-template-columns: 72px 1fr; gap: 10px; font-size: 12px;
  line-height: 1.5; align-items: start; }
.msg .role { font-family: var(--mono); font-size: 11px; color: var(--text-3);
  text-align: right; padding-top: 1px; }
.msg .role.target { color: var(--good); }
.msg div:last-child { white-space: pre-wrap; word-break: break-word; }
.empty { color: var(--text-3); font-size: 13px; padding: 22px 0; text-align: center; }
.item { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
  background: var(--surface-1); }
.item summary { cursor: pointer; padding: 9px 13px; display: flex; gap: 11px;
  align-items: center; font-size: 13px; }
.item summary::-webkit-details-marker { display: none; }
.item pre { margin: 0; padding: 12px 14px; border-top: 1px solid var(--border);
  background: var(--surface-2); border-radius: 0 0 8px 8px; overflow-x: auto;
  font: 12px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
  max-height: 380px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px;
  font-size: 13px; margin: 0; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
.toolbar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.chip { border: 1px solid var(--border-strong); background: var(--surface-1);
  color: var(--text-2); border-radius: 20px; padding: 3px 11px; font-size: 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text-1); color: var(--surface-1);
  border-color: var(--text-1); }
.back { background: none; border: 0; color: var(--text-2); cursor: pointer;
  font: inherit; padding: 0 0 12px; }
.back:hover { color: var(--text-1); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
.live .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.theme { margin-top: auto; border: 1px solid var(--border); background: var(--surface-0);
  color: var(--text-2); border-radius: 7px; padding: 6px 10px; font-size: 12px;
  cursor: pointer; text-align: left; }
.theme:hover { color: var(--text-1); }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  nav { position: static; max-height: none; flex-direction: row; gap: 4px; overflow-x: auto; padding: 10px; }
  .theme { margin-top: 0; }
  nav .group, .brand { display: none; }
  main { padding: 18px; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="navcol"><nav id="nav"></nav></div>
  <main id="main"></main>
</div>
<div class="tooltip" id="tt"></div>

<script>
const S = { state: null, experiments: [], agentRuns: [], view: "system",
            detail: null, rollouts: [], rolloutKind: "all", data: null, runId: null, traceId: null, err: null };
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v, d = 3) => v == null || Number.isNaN(Number(v)) ? "–"
  : (Math.abs(v) >= 100000 || (Math.abs(v) < 0.001 && v != 0)) ? Number(v).toExponential(1)
  : Number(Number(v).toFixed(d)).toString();
const ago = ts => {
  if (!ts) return "–";
  const s = Date.now() / 1000 - Number(ts);
  if (s < 60) return Math.max(0, s | 0) + "s ago";
  if (s < 3600) return ((s / 60) | 0) + "m ago";
  if (s < 86400) return ((s / 3600) | 0) + "h ago";
  return ((s / 86400) | 0) + "d ago";
};
async function get(u) { const r = await fetch(u); if (!r.ok) throw new Error(u + " → " + r.status); return r.json(); }

/* ---- charts: 2px lines, hairline solid grid, r=4 end markers with a 2px
   surface ring, direct end-labels (also the relief for the sub-3:1 light hue),
   crosshair tooltip. Never two y-scales on one plot. ---- */
const SERIES = ["var(--series-1)", "var(--series-2)", "var(--series-3)"];

function lineChart(el, series, opts) {
  opts = opts || {};
  const W = Math.max(el.clientWidth || 640, 260), H = opts.height || 190;
  const P = { t: 14, r: 60, b: 26, l: 46 };
  const pts = series.flatMap(s => s.points);
  if (!pts.length) { el.innerHTML = '<div class="empty">no data yet</div>'; return; }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) { const s = Math.abs(y0 || 1) * .5; y1 = y0 + s; y0 = y0 - s; }
  const pad = (y1 - y0) * .12; y0 -= pad; y1 += pad;
  // round the axis to clean steps rather than raw range fractions
  const nice = (r, round) => {
    const e = Math.floor(Math.log10(r)), f = r / Math.pow(10, e);
    const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10)
                     : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
    return nf * Math.pow(10, e);
  };
  const step = nice((y1 - y0) / 4, true);
  y0 = Math.floor(y0 / step) * step; y1 = Math.ceil(y1 / step) * step;
  const X = v => P.l + (v - x0) / (x1 - x0) * (W - P.l - P.r);
  const Y = v => H - P.b - (v - y0) / (y1 - y0) * (H - P.t - P.b);

  let svg = `<svg class="plot" viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(opts.title || "chart")}">`;
  for (let v = y0; v <= y1 + step / 2; v += step) {
    const y = Y(v).toFixed(1);
    svg += `<line class="grid-line" x1="${P.l}" y1="${y}" x2="${W - P.r}" y2="${y}"/>`
        +  `<text class="axis-text" x="${P.l - 8}" y="${(+y + 3.5).toFixed(1)}" text-anchor="end">${num(v, 2)}</text>`;
  }
  [x0, x1].forEach(v => svg += `<text class="axis-text" x="${X(v).toFixed(1)}" y="${H - 8}" text-anchor="middle">${opts.xLabel ? opts.xLabel(v) : num(v, 0)}</text>`);

  series.forEach((s, i) => {
    const c = SERIES[i % SERIES.length];
    const d = s.points.map((p, j) => (j ? "L" : "M") + X(p.x).toFixed(1) + "," + Y(p.y).toFixed(1)).join(" ");
    svg += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.points[s.points.length - 1];
    svg += `<circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="4" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>`
        +  `<text class="axis-text" x="${(X(last.x) + 10).toFixed(1)}" y="${(Y(last.y) + 3.5).toFixed(1)}" style="fill:var(--text-2)">${num(last.y, 2)}</text>`;
  });
  svg += `<line class="cross" x1="0" y1="${P.t}" x2="0" y2="${H - P.b}" style="opacity:0"/>`
      +  `<rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/></svg>`;
  el.innerHTML = svg;

  const tt = $("#tt"), cross = el.querySelector(".cross"), hit = el.querySelector("rect");
  hit.addEventListener("mousemove", e => {
    const box = el.querySelector("svg").getBoundingClientRect();
    const sx = (e.clientX - box.left) / box.width * W;
    const xv = x0 + (sx - P.l) / (W - P.l - P.r) * (x1 - x0);
    cross.setAttribute("x1", sx); cross.setAttribute("x2", sx); cross.style.opacity = 1;
    const near = series[0].points.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a);
    tt.innerHTML = `<div class="tt-step">${opts.xLabel ? opts.xLabel(near.x) : "x " + num(near.x, 0)}</div>`
      + series.map((s, i) => {
          const p = s.points.reduce((a, b) => Math.abs(b.x - xv) < Math.abs(a.x - xv) ? b : a);
          return `<div class="tt-row"><span><i style="display:inline-block;width:9px;height:9px;border-radius:2px;background:${SERIES[i % SERIES.length]};margin-right:6px"></i>${esc(s.name)}</span><b>${num(p.y, 3)}</b></div>`;
        }).join("");
    tt.style.opacity = 1;
    tt.style.left = Math.min(e.clientX + 14, innerWidth - 200) + "px";
    tt.style.top = (e.clientY - 10) + "px";
  });
  hit.addEventListener("mouseleave", () => { tt.style.opacity = 0; cross.style.opacity = 0; });
}

const legend = s => s.length < 2 ? "" :   /* one series needs no legend box */
  `<div class="legend">${s.map((x, i) => `<span><i style="background:${SERIES[i % SERIES.length]}"></i>${esc(x.name)}</span>`).join("")}</div>`;

function chartCard(title, series, opts) {
  const id = "c" + Math.random().toString(36).slice(2, 8);
  setTimeout(() => { const el = $("#" + id); if (el) lineChart(el, series, Object.assign({ title }, opts)); }, 0);
  return `<div class="card"><div class="chart-head"><h2>${esc(title)}</h2>${legend(series)}</div><div id="${id}"></div></div>`;
}

function statusPill(s) {
  const k = String(s || "").toLowerCase();
  const cls = k === "completed" ? "good" : k === "failed" ? "crit" : k === "running" ? "warn" : "";
  const icon = k === "completed" ? "✓" : k === "failed" ? "✕" : k === "running" ? "◐" : "•";
  return `<span class="pill ${cls}"><span aria-hidden="true">${icon}</span>${esc(s || "unknown")}</span>`;
}

/* ---------------------------------------------------------------- views */

/* The agent-runs log holds BOTH stages in one file, separated by the stage
   markers the remote runner writes. Split it so each agent's transcript reads
   on its own — they are two different agents doing two different jobs. */
function splitTranscript(log) {
  const out = { trigger: "", autoresearch: "" };
  if (!log) return out;
  const re = /=====\s*remote (trigger-agent|autoresearch):\s*started\s*=====/g;
  const marks = [];
  let m;
  while ((m = re.exec(log))) marks.push({ name: m[1], at: m.index, end: re.lastIndex });
  if (!marks.length) { out.trigger = log; return out; }   // local runs: one stream
  marks.forEach((mk, i) => {
    const body = log.slice(mk.end, i + 1 < marks.length ? marks[i + 1].at : log.length);
    const key = mk.name === "autoresearch" ? "autoresearch" : "trigger";
    out[key] += body;
  });
  return out;
}

function stage(label, value, note, on) {
  return `<div class="stage ${on ? "on" : ""}">
    <div class="stage-v">${value}</div><div class="stage-l">${esc(label)}</div>
    <div class="stage-n">${esc(note || "")}</div></div>`;
}

function viewSystem() {
  const st = S.state || {}, tr = st.traces || {}, tg = st.trigger || {};
  const gate = tg.log || [], escs = st.escalations || [];
  const policy = (st.gate || {}).policy || {};
  const nTraces = tr.total ?? (tr.items || []).length;
  const yes = escs.filter(e => (e.verdict || {}).worth_autoresearch).length;
  const agentExps = S.experiments.filter(e => e.trigger);
  const manualExps = S.experiments.length - agentExps.length;
  const sig = g => { const v = (g.signal && (g.signal.failure_rate ?? g.signal.rate ??
    Object.values(g.signal)[0])); return Number(v ?? 0); };
  const fail = [{ name: "failure rate", points: gate.map((g, i) => ({ x: i, y: sig(g) })) }];

  return `<div class="page-head">
      <div><h1>${esc(((st.project || {}).name) || "system")}</h1>
        <p class="sub">A continual-learning system — traces are ingested, a cheap detection
        function decides when something is wrong, the trigger agent judges whether it is worth
        acting on, and the autoresearch agent does the ML research.</p></div>
      <span class="live"><span class="dot"></span>live</span></div>

    <div class="card"><h2>The loop</h2><div class="pipeline">
      ${stage("Traces ingested", nTraces, `${(tr.sources || []).length} source(s)`, nTraces > 0)}
      <div class="arrow">→</div>
      ${stage("Gate evaluations", gate.length, esc(policy.kind || "no detection fn"), gate.length > 0)}
      <div class="arrow">→</div>
      ${stage("Escalations", escs.length, "trigger agent judged", escs.length > 0)}
      <div class="arrow">→</div>
      ${stage("Worth research", yes, "autoresearch ran", yes > 0)}
      <div class="arrow">→</div>
      ${stage("Experiments", agentExps.length, `${manualExps} more from the SDK`, agentExps.length > 0)}
    </div></div>

    <div class="card"><h2>Detection function</h2>
      ${Object.keys(policy).length ? `<dl class="kv">
        <dt>kind</dt><dd><code>${esc(policy.kind || "–")}</code></dd>
        <dt>source</dt><dd><code>${esc((st.gate || {}).source_path || policy.import_path || "–")}</code></dd>
        <dt>runs every</dt><dd>${esc(policy.every_n ?? "–")} trace(s) over a window of ${esc(policy.window ?? "–")}</dd>
        <dt>params</dt><dd><code>${esc(JSON.stringify(policy.params || {}))}</code></dd>
      </dl>` : '<div class="empty">No trigger configured in this system.yaml.</div>'}
    </div>
    ${gate.length ? chartCard("Failure rate per gate evaluation", fail,
        { height: 176, xLabel: v => "eval " + Math.round(v) }) : ""}

    <div class="card"><h2>Agent runs</h2>
      ${escs.length ? escs.map(e => {
        const v = e.verdict || {}, has = v && Object.keys(v).length;
        const t = splitTranscript(e.agent_log);
        const ran = S.agentRuns.find(a => a.escalation === e.id) || {};
        const mine = S.experiments.filter(x => x.trigger && x.trigger.escalation === e.id);
        return `<div class="run-block">
          <div class="chart-head"><h3>${esc(e.id)}</h3>

          <div class="agent-row">
            <div class="agent">
              <div class="agent-h"><b>Trigger agent</b>
                ${has ? `<span class="pill ${v.worth_autoresearch ? "good" : ""}">${v.worth_autoresearch ? "✓ escalate" : "✕ stand down"}</span>`
                      : '<span class="pill">no verdict</span>'}</div>
              <p class="agent-p">Judges whether this batch is a real, recurring failure worth spending research on.</p>
              ${v.hypothesis ? `<dl class="kv"><dt>hypothesis</dt><dd>${esc(v.hypothesis)}</dd></dl>` : ""}
              ${t.trigger ? `<details class="item"><summary>transcript</summary><pre>${esc(t.trigger.slice(-6000))}</pre></details>`
                          : '<div class="empty" style="padding:10px 0">no transcript</div>'}
            </div>
            <div class="agent">
              <div class="agent-h"><b>Autoresearch agent</b>
                ${v.worth_autoresearch ? `<span class="pill good">ran${ran.sandbox ? " in " + esc(ran.sandbox) : ""}</span>`
                                       : '<span class="pill">not triggered</span>'}</div>
              <p class="agent-p">Does the ML research: designs and launches experiments, then rewrites the artifact.</p>
              ${mine.length ? `<table><tbody>${mine.map(x => `<tr class="clickable" data-exp="${esc(x.id)}">
                  <td><b>${esc(x.experiment_name)}</b></td><td>${statusPill(x.status)}</td>
                  <td class="num">${x.best_score == null ? "–" : num(x.best_score)}</td></tr>`).join("")}</tbody></table>`
                : '<div class="empty" style="padding:10px 0">no experiments launched</div>'}
              ${t.autoresearch ? `<details class="item"><summary>transcript</summary><pre>${esc(t.autoresearch.slice(-6000))}</pre></details>` : ""}
            </div>
          </div></div>`;
      }).join("") : '<div class="empty">The gate has not fired yet — no agent has run.</div>'}
    </div>

    <div class="card"><h2>Trace sources</h2>
      ${(tr.sources || []).length ? `<table><thead><tr><th>Source</th></tr></thead><tbody>`
        + tr.sources.map(x => `<tr><td><code>${esc(typeof x === "string" ? x : (x.name || x.kind || ""))}</code></td></tr>`).join("")
        + `</tbody></table>`
        : '<div class="empty">No trace sources configured.</div>'}</div>`;
}

function viewOverview() {

function expTable(list) {

function viewExperiments() {
  return `<div class="page-head"><div><h1>Experiments</h1>
      <p class="sub">Everything the SDK recorded locally — metrics, evaluations, checkpoints, rollouts.</p></div></div>
    <div class="card">${S.experiments.length ? expTable(S.experiments)
      : '<div class="empty">No experiments in the local mirror yet.</div>'}</div>`;
}

function viewDetail() {
  const d = S.detail;
  if (!d) return '<button class="back" id="back">← all experiments</button><div class="empty">loading…</div>';
  const exp = d.experiment || {};
  const runs = (d.ungrouped_runs || []).concat((d.groups || []).flatMap(g => g.runs || []));
  if (!runs.length) return '<button class="back" id="back">← all experiments</button><div class="empty">This experiment has no runs.</div>';
  if (!runs.some(r => r.id === S.runId)) S.runId = runs[0].id;
  const run = runs.find(r => r.id === S.runId);
  const runTabs = runs.length > 1 ? `<div class="toolbar" style="margin-bottom:16px">
      <span class="muted" style="font-size:12px">runs (training generations)</span>
      ${runs.map(r => `<button class="chip" data-run="${esc(r.id)}" aria-pressed="${r.id === S.runId}">
        ${esc((r.run_config && r.run_config.name) || r.id.slice(0, 8))}${r.seed != null ? " · seed " + esc(r.seed) : ""}</button>`).join("")}
    </div>` : "";

  const byName = {};
  (run.metrics || []).forEach(p => (byName[p.name] = byName[p.name] || []).push(p));
  const mk = n => byName[n] ? [{ name: n, points: byName[n].map(p => ({ x: p.step, y: p.value })) }] : null;
  const reward = mk("reward/mean"), loss = mk("train/loss") || mk("train/mean_loss");
  const shown = ["reward/mean", "train/loss", "train/mean_loss"];
  const others = Object.keys(byName).filter(n => !shown.includes(n));
  const rc = run.rollout_counts || {};
  const total = Object.values(rc).reduce((a, b) => a + b, 0);
  const stepLabel = v => "step " + Math.round(v);

  return `<button class="back" id="back">← all experiments</button>
    <div class="page-head">
      <div><h1>${esc(exp.experiment_name || "experiment")}</h1>
        <p class="sub">${esc(exp.hypothesis || "")}</p></div>${statusPill(exp.status)}</div>
    ${runTabs}
    <div class="grid g4" style="margin-bottom:16px">
      <div class="tile"><div class="label">Algorithm</div>
        <div class="value" style="font-size:20px">${esc(run.recipe_kind || "–")}</div>
        <div class="foot">seed ${esc(run.seed ?? "–")} · ${esc(run.status || "")}</div></div>
      <div class="tile"><div class="label">Metric points</div><div class="value">${(run.metrics || []).length}</div>
        <div class="foot">${Object.keys(byName).length} distinct metric(s)</div></div>
      <div class="tile"><div class="label">Rollouts kept</div><div class="value">${total}</div>
        <div class="foot">${Object.entries(rc).map(([k, v]) => v + " " + k).join(" · ") || "none"}</div></div>
      <div class="tile"><div class="label">Checkpoints</div><div class="value">${(run.checkpoints || []).length}</div>
        <div class="foot">${(run.checkpoints || []).some(c => c.is_final) ? "final saved" : "no final"}</div></div>
    </div>
    ${reward ? chartCard("Mean reward per step", reward, { xLabel: stepLabel }) : ""}
    ${loss ? chartCard("Training loss per step", loss, { xLabel: stepLabel }) : ""}
    ${others.length ? `<div class="card"><h2>Other metrics</h2><table><thead><tr>
        <th>Metric</th><th>First</th><th>Last</th><th>Points</th></tr></thead><tbody>`
      + others.map(n => { const s = byName[n]; return `<tr><td><code>${esc(n)}</code></td>
          <td class="num">${num(s[0].value)}</td><td class="num">${num(s[s.length - 1].value)}</td>
          <td class="num muted">${s.length}</td></tr>`; }).join("") + `</tbody></table></div>` : ""}
    ${(run.evals || []).length ? `<div class="card"><h2>Evaluations</h2><table><thead><tr><th>Step</th>`
      + Object.keys(run.evals[0].metrics || {}).map(k => `<th>${esc(k)}</th>`).join("") + `</tr></thead><tbody>`
      + run.evals.map(ev => `<tr><td class="num">${ev.step ?? "final"}</td>`
        + Object.values(ev.metrics || {}).map(v => `<td class="num">${num(v)}</td>`).join("") + `</tr>`).join("")
      + `</tbody></table></div>` : ""}
    ${(run.checkpoints || []).length ? `<div class="card"><h2>Checkpoints</h2><table><thead><tr>
        <th>Label</th><th>Step</th><th>Final</th><th>URI</th></tr></thead><tbody>`
      + run.checkpoints.map(c => `<tr><td>${esc(c.label || "–")}</td><td class="num">${c.step ?? "–"}</td>
          <td>${c.is_final ? "✓" : ""}</td><td><code>${esc((c.uri || "–").slice(0, 56))}</code></td></tr>`).join("")
      + `</tbody></table></div>` : ""}
    <div class="card"><h2>Data</h2>
      <p class="agent-p">What went in, and what the transform chain turned it into.</p>
      <div id="data"><div class="empty">loading…</div></div></div>
    <div class="card"><div class="chart-head"><h2>Rollouts</h2>
        <div class="toolbar">${["all", "train", "validation", "eval"].map(k =>
          `<button class="chip" data-kind="${k}" aria-pressed="${S.rolloutKind === k}">${k}</button>`).join("")}</div></div>
      <div id="rollouts"><div class="empty">loading…</div></div></div>`;
}


/* The two final formats look nothing alike and deserve different rendering:
   SFT rows are a conversation, harbor RL rows are a task + a verifier. */
function renderRow(row, fmt) {
  if (fmt === "chat_messages" && Array.isArray(row.messages)) {
    return `<div class="msgs">` + row.messages.map(m =>
      `<div class="msg"><span class="role">${esc(m.role || "")}</span>
        <div>${esc(typeof m.content === "string" ? m.content : JSON.stringify(m.content))}</div></div>`).join("")
      + (row.target_assistant ? `<div class="msg"><span class="role target">target</span>
          <div>${esc(row.target_assistant)}</div></div>` : "") + `</div>`;
  }
  if (fmt === "harbor_task") {
    const v = row.verifier || {};
    return `<dl class="kv">
      <dt>task_id</dt><dd><code>${esc(row.task_id || "")}</code></dd>
      <dt>instruction</dt><dd>${esc(row.instruction || "")}</dd>
      <dt>verifier</dt><dd><code>${esc(v.kind || v.fn_name || "")}</code>${v.expected !== undefined ? ` → expects <code>${esc(String(v.expected))}</code>` : ""}</dd>
      ${row.metadata && Object.keys(row.metadata).length ? `<dt>metadata</dt><dd><code>${esc(JSON.stringify(row.metadata))}</code></dd>` : ""}
    </dl>`;
  }
  if (fmt === "prompt_dataset") {
    return `<dl class="kv"><dt>inputs</dt><dd><code>${esc(JSON.stringify(row.inputs))}</code></dd>
      <dt>expected</dt><dd>${esc(String(row.expected))}</dd></dl>`;
  }
  return `<pre>${esc(JSON.stringify(row, null, 2))}</pre>`;
}

const FMT_LABEL = { chat_messages: "SFT · chat messages", harbor_task: "RL · harbor task",
                    prompt_dataset: "prompt dataset", unknown: "unrecognised" };

function renderData() {
  const el = $("#data"); if (!el) return;
  const d = S.data;
  if (!d) { el.innerHTML = '<div class="empty">loading…</div>'; return; }
  const raw = d.stages.raw, train = d.stages.train;
  if (!raw.n && !train.n) {
    el.innerHTML = '<div class="empty">No data recorded for this run.</div>'; return;
  }
  const src = Object.entries(d.source || {}).map(([k, v]) => `${k}=${v}`).join(" · ");
  const chain = (d.transforms || []).length
    ? d.transforms.map(t => `<code>${esc(t.kind || t)}</code>`).join(' <span class="muted">→</span> ')
    : '<span class="muted">no transforms — the rows are used as loaded</span>';
  const pane = (title, st, i) => `<div class="agent">
      <div class="agent-h"><b>${title}</b>
        <span class="pill">${esc(FMT_LABEL[st.format] || st.format)}</span></div>
      <p class="agent-p">${st.n ? `showing ${Math.min(st.n, 3)} of the first ${st.n} row(s)` : "not recorded"}</p>
      ${st.rows.slice(0, 3).map((r, j) => `<details class="item" ${j === 0 ? "open" : ""}>
          <summary><span class="mono muted">row ${j}</span></summary>
          <div style="padding:12px 14px;border-top:1px solid var(--border)">${renderRow(r, st.format)}</div>
        </details>`).join("")}
    </div>`;
  el.innerHTML = `<div class="chain">${src ? `<span class="muted">${esc(src)}</span> <span class="muted">→</span> ` : ""}${chain}</div>
    <div class="agent-row">${pane("Raw — as loaded", raw, 0)}${pane("Training data — after transforms", train, 1)}</div>`;
}

function renderRollouts() {
  const el = $("#rollouts"); if (!el) return;
  const list = S.rollouts;
  if (!list.length) { el.innerHTML = '<div class="empty">No rollouts captured for this run.</div>'; return; }
  el.innerHTML = list.slice(0, 40).map(p => {
    const r = p.reward;
    const cls = r == null ? "" : r >= 1 ? "good" : r > 0 ? "warn" : "crit";
    const tok = p.metadata && p.metadata.completion_tokens != null ? p.metadata.completion_tokens + " tok" : "";
    return `<details class="item"><summary>
        <span class="pill ${cls}">${r == null ? "–" : num(r, 2)}</span>
        <span class="mono muted">${esc(p.kind)}</span>
        <span class="muted">step ${p.step ?? "–"}</span>
        <span class="muted">${esc(p.task_id || "")}</span>
        <span style="flex:1"></span><span class="muted mono">${tok}</span></summary>
      ${p.instruction ? `<pre>${esc(p.instruction)}</pre>` : ""}
      <pre>${esc(p.model_output || "(no decoded output — the trajectory carried token ids only)")}</pre>
    </details>`;
  }).join("") + (list.length > 40 ? `<div class="empty">showing 40 of ${list.length}</div>` : "");
}

function viewPrompt() {

const VIEWS = [
  { id: "system",      label: "System",        fn: viewSystem,
    count: () => ((S.state || {}).escalations || []).length },
  { id: "experiments", label: "Experiments",   fn: viewExperiments, count: () => S.experiments.length },
  { id: "traces",      label: "Traces",        fn: viewTraces },

];

function renderNav() {
  $("#nav").innerHTML =
    `<div class="brand"><b>evsys</b><span>${esc(((S.state || {}).project || {}).name || "")}</span></div>`
    + `<div class="group">system</div>`
    + VIEWS.map(v => {
        const c = v.count ? v.count() : 0;
        const on = S.view === v.id || (S.view === "detail" && v.id === "experiments")
             || (S.view === "trace" && v.id === "traces");
        return `<button data-view="${v.id}" aria-current="${on}"><span>${v.label}</span>${c ? `<span class="count">${c}</span>` : ""}</button>`;

function render() {
  renderNav();
  const main = $("#main");
  if (S.err) { main.innerHTML = `<div class="card"><div class="empty">${esc(S.err)}</div></div>`; return; }
  main.innerHTML = S.view === "detail" ? viewDetail()
    : S.view === "trace" ? viewTrace()
    : (VIEWS.find(v => v.id === S.view) || VIEWS[0]).fn();
  if (S.view === "detail") { renderRollouts(); renderData(); }
}

async function loadRun() {
  if (!S.runId) return;
  const q = S.rolloutKind === "all" ? "" : "?kind=" + S.rolloutKind;
  const [preds, data] = await Promise.all([
    get(`/api/runs/${S.runId}/predictions${q}`).catch(() => ({ predictions: [] })),
    get(`/api/runs/${S.runId}/data`).catch(() => null),
  ]);
  S.rollouts = preds.predictions || []; S.data = data;
  renderRollouts(); renderData();
}

document.addEventListener("click", async e => {
  const nb = e.target.closest("nav button[data-view]");
  if (nb) { S.view = nb.dataset.view; S.detail = null; render(); return; }
  const row = e.target.closest("tr[data-exp]");
  if (row) {
    S.view = "detail"; S.detail = null; S.rollouts = []; S.data = null; render();
    S.runId = null; S.data = null;
    S.detail = await get("/api/experiments/" + row.dataset.exp + "/detail");
    render(); loadRun(); return;
  }
  if (e.target.closest("#back")) { S.view = "experiments"; S.detail = null; render(); return; }
  if (e.target.closest("#back-traces")) { S.view = "traces"; S.traceId = null; render(); return; }
  const trow = e.target.closest("tr[data-trace]");
  if (trow) { S.traceId = trow.dataset.trace; S.view = "trace"; render(); return; }
  const chip = e.target.closest(".chip[data-kind]");
  if (chip && S.detail) {
    S.rolloutKind = chip.dataset.kind;
    document.querySelectorAll(".chip[data-kind]").forEach(c =>
      c.setAttribute("aria-pressed", c.dataset.kind === S.rolloutKind));
    loadRun();
    return;
  }
  const rb = e.target.closest(".chip[data-run]");
  if (rb && S.detail) { S.runId = rb.dataset.run; render(); loadRun(); }
});
document.addEventListener("click", e => {
  if (!e.target.closest("#theme")) return;
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : cur === "light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
  render();
});
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 150); });

async function tick() {
  try {
    const [state, experiments, agentRuns] = await Promise.all([
      get("/api/state").catch(() => ({})),
      get("/api/experiments").catch(() => []),
      get("/api/agent-runs").catch(() => []),
    ]);
    S.state = state; S.experiments = experiments; S.agentRuns = agentRuns; S.err = null;
  } catch (err) { S.err = String(err); }
  if (S.view === "detail" || S.view === "trace") renderNav(); else render();
}
tick(); setInterval(tick, 4000);
</script>
</body>
</html>
